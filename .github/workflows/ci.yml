name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arkadion
          POSTGRES_PASSWORD: arkadion
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkadion"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          # GITHUB_TOKEN cannot read the private submodule repos
          # (aurel-dashboard-*, patlix-people-*), so use a PAT with
          # repo/read scope for submodule checkout.
          token: ${{ secrets.GH_SUBMODULE_PAT }}

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Each feature project is a git submodule with its own dependencies
      - run: npm install --prefix apps/arkadion-api
      - run: npm install --prefix apps/arkadion-web
      - run: npm install --prefix apps/falina-api
      - run: npm install --prefix apps/falina-web
      - run: npm install --prefix libs/falina-shared
      - run: npm install --prefix apps/patlix-world-api
      - run: npm install --prefix apps/patlix-world-web
      - run: npm install --prefix libs/patlix-world-shared
      - run: npm install --prefix apps/aurel-dashboard-api
      - run: npm install --prefix apps/patlix-people-api
      - run: npm install --prefix apps/patlix-people-web
      - run: npm install --prefix libs/patlix-people-shared

      # Provision databases used by e2e suites
      - name: Create e2e databases
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U arkadion -d postgres -c "CREATE ROLE falina LOGIN PASSWORD 'falina';" -c "CREATE DATABASE falina OWNER falina;"
          docker exec -i ${{ job.services.postgres.id }} psql -U arkadion -d postgres -c "CREATE ROLE patlixworld LOGIN PASSWORD 'patlixworld';" -c "CREATE DATABASE patlixworld OWNER patlixworld;"

      - run: npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck e2e --parallel=1
