<div class="app-shell" [class.collapsed]="collapsed()">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <div class="brand-logo">
          <mat-icon>smart_toy</mat-icon>
        </div>
        <div class="brand-text">
          <span class="brand-name">AUREL AI</span>
          <span class="brand-sub">COMMAND CENTER</span>
        </div>
      </div>
      <button
        class="collapse-btn"
        matIconButton
        [attr.title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        (click)="toggleSidebar()"
      >
        <mat-icon>{{ collapsed() ? 'menu_open' : 'menu' }}</mat-icon>
      </button>
    </div>

    <!-- Big bot avatar + voice waves -->
    <div class="bot-zone">
      <div class="bot-avatar">
        <div class="bot-ring"></div>
        <img class="bot-core" src="avatars/aurel-256.png" alt="Aurel avatar" />
        <span class="bot-status"></span>
      </div>
      <div class="bot-voice">
        <div class="voice-label">AUREL</div>
        <div class="voice-waves">
          @for (w of wave; track $index) {
          <span
            class="voice-bar"
            [style.height.px]="w"
            [style.animation-delay.ms]="$index * 60"
          ></span>
          }
        </div>
      </div>
    </div>

    <nav class="nav">
      @for (item of navItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="status-pill">
        <span class="status-dot online"></span>
        <span>Systems Online</span>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <mat-icon>query_stats</mat-icon>
        <span class="clock">{{ dateLabel }} | {{ timeLabel }}</span>
      </div>

      <div class="topbar-center">
        <div class="search">
          <mat-icon>search</mat-icon>
          <input type="text" placeholder="Search anything..." />
        </div>
      </div>

      <div class="topbar-right">
        <button
          class="icon-btn theme-toggle"
          matIconButton
          [attr.title]="theme.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
          (click)="theme.toggle()"
        >
          <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
        <button class="icon-btn" matIconButton aria-label="Notifications">
          <mat-icon>notifications</mat-icon>
          <span class="notif-dot"></span>
        </button>
        <div class="user">
          <div class="avatar">{{ userLabel.charAt(0) }}</div>
          <div class="user-text">
            <span class="user-name">{{ userLabel }}</span>
            <span class="user-role">Administrator</span>
          </div>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
