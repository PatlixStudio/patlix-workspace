<div class="auth-page">
  <div class="auth-card">
    <span class="material-symbols-outlined auth-logo">favorite</span>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Join ai-love and meet your companions</p>

    @if (error) {
      <div class="auth-error" role="alert">{{ error }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="name-row">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>First name</mat-label>
          <input matInput [(ngModel)]="name" name="name" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Last name</mat-label>
          <input matInput [(ngModel)]="surname" name="surname" required />
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" required />
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        class="auth-btn"
        type="submit"
        [disabled]="loading || !name || !surname || !email || !password"
      >
        @if (loading) {
          <mat-spinner diameter="20" />
        } @else {
          Create account
        }
      </button>
    </form>

    <p class="auth-switch">
      Already have an account?
      <a routerLink="/login">Log in</a>
    </p>

    <p class="auth-back">
      <a routerLink="/companions">
        <mat-icon>arrow_back</mat-icon> Back to companions
      </a>
    </p>
  </div>
</div>
